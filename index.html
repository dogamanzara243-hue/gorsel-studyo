<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çoklu Stil AI Görsel Üretim Stüdyosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
    
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-amber-400">🎨 AI Görsel Üretim Stüdyosu</h1>
        <p class="text-sm text-slate-400 mt-1">Videolarınız ve hikayeleriniz için çoklu stilde yapay zeka görselleri üretin.</p>
      </div>
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30 w-fit">
        Modül 2 • Görsel Motoru
      </span>
    </div>

    <!-- Motor Seçimi -->
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Üretim Motoru</label>
          <select id="engineSelect" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            <option value="pollinations">⚡ Ücretsiz Bulut Motoru (Kurulumsuz / Anında)</option>
            <option value="gradio">🚀 Kendi Colab GPU Sunucum (Gradio Linki)</option>
          </select>
        </div>
        <div id="gradioBox" class="hidden">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Colab Gradio API Linki</label>
          <input id="apiUrl" type="url" placeholder="https://xxxx.gradio.live" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:border-amber-400" />
        </div>
      </div>
    </div>

    <!-- Sahne Tarifi -->
    <div>
      <label class="block text-sm font-semibold text-amber-300 mb-1.5">Sahne Açıklaması (Prompt - İngilizce önerilir)</label>
      <textarea id="promptInput" rows="3" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="Örn: A woman holding a cup in a beautiful garden with roses, lilies, and trees, looking at the sky">a determined young man working hard at night with a wooden hand plane in a candle-lit carpentry workshop, sweat on face</textarea>
    </div>

    <!-- Stil, Boyut ve Seed Ayarları -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Görsel Stili</label>
        <select id="styleSelect" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
          <option value="comic">📖 Sıcak 2D Çizgi Roman (Hikaye)</option>
          <option value="cinematic">🎬 Sinematik & Gerçekçi (8K)</option>
          <option value="stoic">🏛️ Stoacı / Antik & Altın Işık</option>
          <option value="anime">🌸 Anime / Ghibli İllüstrasyon</option>
          <option value="neon">🌃 Karanlık Neon / Cyberpunk</option>
          <option value="watercolor">🎨 Suluboya & Masal Kitabı</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">En-Boy Oranı</label>
        <select id="ratioSelect" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
          <option value="9:16">📱 9:16 Dikey (Reels / Shorts)</option>
          <option value="16:9">🖥️ 16:9 Yatay (YouTube)</option>
          <option value="1:1">🟦 1:1 Kare (Instagram)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Tohum (Seed - Karakter Sabitleme)</label>
        <input id="seedInput" type="number" value="42" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-2.5 text-sm text-white focus:outline-none focus:border-amber-400" />
      </div>
    </div>

    <button id="generateBtn" type="button" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base transition shadow-lg shadow-amber-500/20">
      ✨ Görseli Oluştur
    </button>

    <div id="statusMsg" class="text-center text-sm text-amber-300 hidden"></div>

    <!-- Sonuç Alanı -->
    <div id="resultArea" class="hidden bg-slate-800/80 border border-slate-700 rounded-2xl p-5 flex flex-col items-center space-y-4">
      <div class="rounded-xl overflow-hidden border border-slate-600 shadow-xl max-w-sm w-full">
        <img id="outputImage" src="" alt="Üretilen Görsel" class="w-full h-auto object-cover" />
      </div>

      <div class="flex flex-wrap gap-3 w-full max-w-sm">
        <button id="downloadBtn" type="button" class="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm transition">
          ⬇️ PNG / JPG İndir
        </button>
        <button id="copyUrlBtn" type="button" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition">
          🔗 Görsel Linkini Kopyala
        </button>
      </div>
      <p id="copyMsg" class="text-xs text-emerald-400 hidden">✅ Görsel bağlantısı kopyalandı! Video birleştiriciye yapıştırabilirsiniz.</p>
    </div>

  </div>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    const STYLE_PROMPTS = {
      comic: ", warm 2D comic book illustration style, expressive ink linework, dramatic cinematic lighting, cozy rustic atmosphere, detailed background, no text, no speech bubbles, masterpiece, 8k",
      cinematic: ", ultra realistic cinematic photography, 8k resolution, natural dramatic lighting, shallow depth of field, shot on 35mm lens, photorealistic, no text",
      stoic: ", epic dark stoic marble statue aesthetic, dramatic golden rim lighting, moody ancient atmosphere, hyperdetailed, 8k, no text",
      anime: ", studio ghibli inspired anime illustration, lush vibrant colors, soft sunlight, emotional atmosphere, detailed background art, 8k, no text",
      neon: ", dark cyberpunk neon illustration, glowing purple and cyan lights, rainy night reflections, cinematic 8k, no text",
      watercolor: ", whimsical watercolor storybook illustration, soft brush strokes, warm pastel tones, artistic paper texture, masterpiece, no text"
    };

    const DIMENSIONS = {
      "9:16": { w: 768, h: 1344, sdW: 512, sdH: 896 },
      "16:9": { w: 1344, h: 768, sdW: 896, sdH: 512 },
      "1:1":  { w: 1024, h: 1024, sdW: 768, sdH: 768 }
    };

    const engineSelect = document.getElementById("engineSelect");
    const gradioBox = document.getElementById("gradioBox");
    const apiUrlEl = document.getElementById("apiUrl");
    const generateBtn = document.getElementById("generateBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultArea = document.getElementById("resultArea");
    const outputImage = document.getElementById("outputImage");
    const downloadBtn = document.getElementById("downloadBtn");
    const copyUrlBtn = document.getElementById("copyUrlBtn");
    const copyMsg = document.getElementById("copyMsg");

    let currentImageUrl = "";

    apiUrlEl.value = localStorage.getItem("gorsel_gradio_url") || "";
    apiUrlEl.addEventListener("change", () => localStorage.setItem("gorsel_gradio_url", apiUrlEl.value.trim()));

    engineSelect.addEventListener("change", () => {
      gradioBox.classList.toggle("hidden", engineSelect.value !== "gradio");
    });

    function showStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.className = `text-center text-sm ${isError ? "text-rose-400" : "text-amber-300"}`;
      statusMsg.classList.remove("hidden");
    }

    generateBtn.addEventListener("click", async () => {
      const prompt = document.getElementById("promptInput").value.trim();
      const styleKey = document.getElementById("styleSelect").value;
      const ratioKey = document.getElementById("ratioSelect").value;
      const seed = Number(document.getElementById("seedInput").value) || Math.floor(Math.random() * 10000);

      if (!prompt) return showStatus("Lütfen bir sahne açıklaması yazın.", true);

      const fullPrompt = prompt + STYLE_PROMPTS[styleKey];
      const dim = DIMENSIONS[ratioKey];

      generateBtn.disabled = true;
      generateBtn.classList.add("opacity-50");
      resultArea.classList.add("hidden");
      copyMsg.classList.add("hidden");
      showStatus("⏳ Görsel çiziliyor, lütfen bekleyin...");

      try {
        if (engineSelect.value === "pollinations") {
          const encoded = encodeURIComponent(fullPrompt);
          const url = `https://image.pollinations.ai/prompt/${encoded}?width=${dim.w}&height=${dim.h}&seed=${seed}&nologo=true`;
          await new Promise((resolve, reject) => {
            outputImage.onload = resolve;
            outputImage.onerror = () => reject(new Error("Bulut sunucusunda yoğunluk oluştu, tekrar deneyin."));
            outputImage.src = url;
          });
          currentImageUrl = url;
        } else {
          const baseUrl = apiUrlEl.value.trim().replace(/\/+$/, "");
          if (!baseUrl) throw new Error("Lütfen Colab Gradio API adresini girin.");
          const client = await Client.connect(baseUrl);
          const res = await client.predict("/gorsel_uret", {
            prompt: fullPrompt,
            genislik: dim.sdW,
            yukseklik: dim.sdH,
            seed: seed
          });
          const imgObj = res.data[0];
          currentImageUrl = imgObj.url || imgObj;
          outputImage.src = currentImageUrl;
        }

        statusMsg.classList.add("hidden");
        resultArea.classList.remove("hidden");
      } catch (err) {
        showStatus(`❌ Hata: ${err.message}`, true);
      } finally {
        generateBtn.disabled = false;
        generateBtn.classList.remove("opacity-50");
      }
    });

    downloadBtn.addEventListener("click", async () => {
      if (!currentImageUrl) return;
      try {
        const res = await fetch(currentImageUrl);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = "ai_sahne_gorseli.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch {
        window.open(currentImageUrl, "_blank");
      }
    });

    copyUrlBtn.addEventListener("click", () => {
      if (!currentImageUrl) return;
      navigator.clipboard.writeText(currentImageUrl);
      copyMsg.classList.remove("hidden");
    });
  </script>
</body>
</html>
